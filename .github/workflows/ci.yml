name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests, type check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (TypeScript)
        run: bun x tsc --noEmit -p tsconfig.json

      - name: Linter check
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: E2E tests (Amnesic / In-Memory PostgreSQL)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caregiving_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: caregiving_test_db
      DB_SYNCHRONIZE: true
      DB_LOGGING: false
      JWT_SECRET: ci-only-secret-key-1234567890
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: E2E tests
        run: bun run test:e2e

  postman:
    name: Postman / Newman API test suite
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caregiving_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    env:
      PORT: 3000
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: caregiving_test_db
      DB_SYNCHRONIZE: true
      DB_LOGGING: false
      JWT_SECRET: ci-only-secret-key-1234567890
      JWT_EXPIRES_IN: 24h
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Start API and Run Postman Collection via Newman
        run: |
          node dist/main &
          SERVER_PID=$!
          echo "Waiting for CareConnect API on http://localhost:3000..."
          READY=false
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/v1/caregivers/search > /dev/null 2>&1; then
              READY=true
              echo "CareConnect API is ready!"
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "Error: Server failed to start within 30s"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Newman runs all requests and assertions. Exits with 1 if any failure occurs.
          bun run test:postman
          TEST_EXIT_CODE=$?

          kill $SERVER_PID 2>/dev/null || true
          exit $TEST_EXIT_CODE
